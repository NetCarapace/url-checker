# https://github.com/pypa/setuptools/blob/main/docs/userguide/quickstart.rst
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "url-checker"
version = "1.0.0"
description = "URL Checker is a tool allowing to validate a URL, with a Flask-based API backend for URL checking using Celery, SQLAlchemy, and MariaDB."
keywords = ["URL Shortener", "URL Checker"]
authors = [
    {name = "Cédric Renzi", email = "cedric.renzi@restena.lu"},
]
maintainers = [
    { name = "Cédric Renzi", email = "cedric.renzi@laposte.net" },
]
license = {text = "MIT"}
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13,<3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: TODO",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "commentjson",
    "Flask>=3.0.0",
    "celery>=5.3.4",
    "Flask-SQLAlchemy>=3",
    "flask-migrate>=4",
    "marshmallow>=4",
    "SQLAlchemy>=2.0.23",
    "pika>=1.3.0",
    "python-dotenv>=1.0.0",
    "flower>=2.0.1",  # Optional: Celery monitoring
    "PyMySQL>=1.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "black",
    "cookiecutter",
    "coverage",
    "flake8",
    "isort",
    "pre-commit",
    "pycln",
    "pydocstyle",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]

[project.urls]
Homepage = "https://github.com/URLCarapace/url-checker"

[project.scripts]
url-checker = "url_checker.app:main"
#start-flask = "url_checker.app:main"
#start-celery = "celery -A url_analyzer.tasks.celery worker --loglevel=info"
#start-flower = "celery -A url_analyzer.tasks.celery flower"
#run-tests = "pytest tests/"

#[build-system]
#requires = ["setuptools"]
#build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["ansible*", "tests*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.rst", "*.txt"]
"hello" = ["*.msg"]

[tool.bumpversion]
version = "1.0.0"
commit = true
tag = true

[tool.bumpversion.file."src/url_checker/__init__.py"]
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.black]
#basepython = python3.13
#line-length = 79
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
